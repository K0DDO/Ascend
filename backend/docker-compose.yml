services:
  postgres:
    image: postgres:16-alpine
    container_name: ascend-postgres
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend
      POSTGRES_DB: ascend
    ports:
      - "55432:5432"
    volumes:
      - ascend_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend -d ascend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ascend_pg_data:
